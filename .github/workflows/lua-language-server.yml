name: Lua Check

on:
  push:
  pull_request:

jobs:
  lua-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify library
        run: |
          echo "Library file count:"
          find "$GITHUB_WORKSPACE/umbrella/library" -type f | wc -l

          echo "Events definition:"
          grep -R -n "Events = {}" "$GITHUB_WORKSPACE/umbrella/library"

          echo "ZombRand definition:"
          grep -R -n "ZombRand" "$GITHUB_WORKSPACE/umbrella/library" | head -10

      - name: Install Lua Language Server
        run: |
          mkdir -p "$RUNNER_TEMP/lua-language-server"
          wget -q https://github.com/LuaLS/lua-language-server/releases/download/3.19.0/lua-language-server-3.19.0-linux-x64.tar.gz
          tar -xzf lua-language-server-3.19.0-linux-x64.tar.gz -C "$RUNNER_TEMP/lua-language-server"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Current directory: $(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          echo "--- .luarc.json ---"
          cat "$GITHUB_WORKSPACE/.luarc.json"
          echo "$RUNNER_TEMP/lua-language-server/bin" >> "$GITHUB_PATH"

      - name: Run Lua Language Server
        run: lua-language-server --check_format=pretty --check="$GITHUB_WORKSPACE" --checklevel=Hint --configpath="$GITHUB_WORKSPACE/.luarc.json"