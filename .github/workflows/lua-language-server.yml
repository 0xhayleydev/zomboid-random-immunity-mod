name: Lua Check

on:
  push:
  pull_request:

jobs:
  lua-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lua Language Server
        shell: pwsh
        run: |
          $url = "https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-win32-x64.zip"
          $archive = "$env:RUNNER_TEMP\lua-language-server.zip"
          $install = "$env:RUNNER_TEMP\lua-language-server"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $install

          Write-Host "LuaLS installed to $install"
          Get-ChildItem -Recurse $install

      - name: Run Lua Language Server
        run: |
          & "$env:RUNNER_TEMP\lua-language-server\bin\lua-language-server.exe" `
            --check_format=pretty `
            --check="$env:GITHUB_WORKSPACE" `
            --configpath="$env:GITHUB_WORKSPACE\.luarc.json" `
            --checklevel=Hint